- title: Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Center for Unified Biometrics and Sensors, University at Buffalo
      year: 2023–now
      location: Amherst, NY
      description:
        - March 2023–present.
        - Conceptualized and developed a proof of concept for vision-language childhood educational material as part of the AI4ExceptionalEd Institute.
        - Worked with large language models, large vision-language models, text-to-image models, and prompt engineering to create factually accurate, reliable, and safe vision-language material for childhood education.
        - Research objectives include methods for generating complex scene images with many compositional elements, and systematic evaluation of hallucination in text-to-image generation.

    - title: Machine Learning Engineer Intern
      institution: ACV Auctions Inc.
      year: 2021–now
      location: Buffalo, NY
      description:
        - May 2021–present.
        - Developed deep learning computer vision models from conceptualization and dataset creation through experimentation and production deployment. Some of this work is included in an upcoming US patent application.
        - Created a model that classifies vehicle interior damage from images, using multi-label classification from up to 20 photos per vehicle with weak vehicle-level annotations.
        - Devised a method for missing-object detection on vehicle undercarriage images to identify and localize missing tailpipe emissions equipment such as catalytic converters.
        - Developed a model to classify structural rust and frame rot from multiple undercarriage images using weak vehicle-level annotations.
        - Implemented a model that classifies image-stitching reconstruction errors in motor vehicle undercarriage scans, so inspectors can fix the scanning system.

    - title: Graduate Research Assistant
      institution: Research Engineering Laboratory for Advanced Computational Science, University at Buffalo
      year: 2019–2023
      location: Amherst, NY
      description:
        - December 2019–March 2023.
        - Developed a method to solve multiscale partial differential equations with neural networks, based on the localized orthogonal decomposition method for numerical homogenization. Presented at the SIAM Conference on Computational Science and Engineering, 2023.
        - Worked on a proof of dimension-independent approximation rates for Lipschitz continuous functions using deep neural networks with ReLU activations, based on a modified Kolmogorov superposition theorem.
        - Explored the feasibility of Lipschitz continuous reparameterizations for the inner function of the Kolmogorov superposition theorem.
        - Created an efficient C implementation of the Kolmogorov superposition theorem for dimension reduction.

    - title: Undergraduate Research Assistant
      institution: Center for Unified Biometrics and Sensors, University at Buffalo
      year: 2017–2019
      location: Amherst, NY
      description:
        - September 2017–December 2019.
        - Adapted deep learning text detection algorithms for handwritten whiteboard lecture video content.
        - Keyframe-based whiteboard lecture video summarization via spatio-temporal conflict minimization.
        - Object-based whiteboard lecture video summarization using deep learning handwritten text detection.
        - Conference paper presentation video search using deep learning text detection.
        - Occlusion and deocclusion for augmented reality.

    - title: Data Science Engineering Intern
      institution: Valuecentric, IQVIA
      year: 2019
      location: Orchard Park, NY
      description:
        - May 2019–August 2019.
        - Built a machine learning model to monitor specialty pharmaceutical patient journeys.
        - Different aspects of the model used random forests, XGBoost, multilayer perceptrons, and LSTMs.

    - title: Undergraduate Research Assistant
      institution: Sensors and Micro-Actuators Learning Lab, University at Buffalo
      year: 2017–2019
      location: Amherst, NY
      description:
        - September 2017–May 2019.
        - Post-processing effects on 3D printed dynamic models created with additive manufacturing.
        - iPhone X Face ID spoofing using a modified 3D printed face, a single facial photograph, and deep learning face modeling.
        - Benchmarking ultrasonic imaging equipment via the modulation transfer function, using microfluidic test targets.

